<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Leticia Ribeiro — Clínica de Estética</title>
<meta name="description" content="Estética avançada, atendimento personalizado e protocolos pensados para você. Clínica Leticia Ribeiro — Abaetetuba e Igarapé-Miri." />
<meta name="theme-color" content="#3F1F29" />
<meta property="og:title" content="Leticia Ribeiro — Clínica de Estética" />
<meta property="og:description" content="Seu cuidado começa aqui. Estética avançada e atendimento personalizado." />
<meta property="og:type" content="website" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A4%8D%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   LETICIA RIBEIRO — CLÍNICA DE ESTÉTICA
   Refinamento visual v2 — Montserrat, editorial, fotografia integrada.
   Estrutura/lógica/preços preservados.
   ============================================================ */

:root{
  /* ---- paleta (rosé sofisticado, nada saturado) ---- */
  --bg:#FAF6F2;          /* branco quente */
  --paper:#FFFFFF;
  --cream:#F2EBE4;       /* off-white nude */
  --rose-1:#F4E9E9;      /* rosa muito claro */
  --rose-2:#E4D0D0;      /* nude rosé */
  --rose-3:#CBA6AB;      /* rosé */
  --burned:#A5646E;      /* rosa queimado */
  --wine:#7C3F4E;        /* vinho/rosa profundo */
  --wine-2:#5E2C39;      /* vinho escuro */
  --wine-3:#3F1F29;      /* quase preto vinho */
  --ink:#2A2320;         /* texto principal (preto quente) */
  --muted:#8C7E7B;       /* secundário */
  --faint:#B6A9A4;       /* terciário */
  --line:#ECE2DA;        /* hairline */
  --line-2:#E2D5CC;
  --rosegold:#C6A98F;    /* metálico sutil */

  --sans:'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;

  --r-card:22px;
  --r-media:20px;
  --r-ctrl:16px;
  --pad:22px;
  --maxw:520px;
  --ease:cubic-bezier(.22,1,.36,1);
  --shadow-soft:0 24px 60px -38px rgba(94,44,57,.45);
  --shadow-card:0 20px 44px -34px rgba(94,44,57,.4);
}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--sans);
  color:var(--ink);
  background:var(--bg);
  line-height:1.66;
  font-weight:400;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  font-variant-numeric:tabular-nums;
  overflow-x:hidden;
}
img{max-width:100%;display:block}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:inherit;text-decoration:none}
::selection{background:var(--rose-2);color:var(--wine-2)}

#stage{
  max-width:var(--maxw);margin:0 auto;position:relative;
  min-height:100vh;min-height:100dvh;background:var(--bg);
  box-shadow:0 0 90px -30px rgba(63,31,41,.28);
}
#app{padding-bottom:132px}

/* ---------- tipografia base ---------- */
h1,h2,h3,h4{font-weight:600;letter-spacing:-.01em;line-height:1.08}
.eyebrow{
  font-size:11px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;
  color:var(--burned);
}
.lede{color:var(--muted);font-size:15.5px;font-weight:400;line-height:1.55}

/* ---------- helpers ---------- */
.wrap{padding:0 var(--pad)}
.hairline{height:1px;background:var(--line);border:0}
.center{text-align:center}

/* ---------- transição de página ---------- */
@keyframes pageIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#app.page-in{animation:pageIn .34s var(--ease)}
@media (prefers-reduced-motion:reduce){#app.page-in{animation:none}}

/* ---------- reveal ---------- */
.reveal{opacity:0;transform:translateY(18px);transition:opacity .8s var(--ease),transform .8s var(--ease)}
.reveal.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){
  .reveal{opacity:1;transform:none;transition:none!important}
  *{scroll-behavior:auto!important}
}

/* ============================================================
   PREÇO — regra única, R$ e valor no mesmo grupo tipográfico
   ============================================================ */
.money{
  display:inline-flex;align-items:baseline;gap:.16em;
  font-variant-numeric:tabular-nums;white-space:nowrap;
  font-weight:600;color:var(--wine);letter-spacing:-.01em;line-height:1;
}
.money .cur{font-size:.8em;font-weight:600;letter-spacing:.01em;}
.money .val{font-size:1em;}
.money-plain{
  font-weight:600;color:var(--wine);font-variant-numeric:tabular-nums;
  white-space:nowrap;letter-spacing:-.005em;line-height:1;
}

/* ============================================================
   BOTÕES
   ============================================================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;width:100%;
  min-height:56px;padding:0 24px;border-radius:var(--r-ctrl);
  font-size:12.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  transition:transform .28s var(--ease),box-shadow .28s var(--ease),background .28s var(--ease),border-color .28s var(--ease);
}
.btn:active{transform:scale(.972)}
.btn svg{width:17px;height:17px;flex:none}
.btn-primary{background:var(--wine);color:#fff;box-shadow:0 16px 34px -18px rgba(124,63,78,.85)}
.btn-primary:hover{background:var(--wine-2)}
.btn-ghost{background:transparent;color:var(--wine);border:1px solid var(--line-2)}
.btn-ghost:hover{border-color:var(--rose-3);background:var(--rose-1)}
.btn-ghost .wa-ico{color:#1FA855}
.btn-light{background:#fff;color:var(--wine);box-shadow:var(--shadow-card)}
.btn-ondark{background:#fff;color:var(--wine-2)}
.btn-ondark:hover{background:var(--rose-1)}
.btn-row{display:flex;flex-direction:column;gap:12px}

/* ============================================================
   MÍDIA (fallback gradiente + foto real por cima)
   ============================================================ */
.media{position:relative;overflow:hidden;background:var(--rose-2)}
.media-ic{position:absolute;inset:0;display:grid;place-items:center;color:rgba(255,255,255,.9)}
.media-ic svg{width:15%;height:auto;max-width:64px;opacity:.92}
.media-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  animation:imgIn .9s var(--ease) both}
@keyframes imgIn{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:none}}
.media-scrim{position:absolute;inset:0;
  background:linear-gradient(to top,rgba(63,31,41,.62),rgba(63,31,41,.12) 52%,rgba(63,31,41,0) 78%)}

/* gradientes-fallback (família rosé-vinho, coesa e sóbria) */
.grad-hero{background:linear-gradient(180deg,#c9a6d9 0%,#a37fb4 30%,#6b4c78 58%,#241826 100%)}
.grad-city-abaetetuba{background:linear-gradient(158deg,#a5646e,#5e2c39)}
.grad-city-igarape-miri{background:linear-gradient(158deg,#b98a94,#7c3f4e)}
.grad-protocolos-corporais{background:linear-gradient(155deg,#bb919a,#7c3f4e)}
.grad-tratamentos-faciais{background:linear-gradient(155deg,#e0c7c8,#b1808a)}
.grad-harmonizacao-facial{background:linear-gradient(155deg,#a5646e,#5e2c39)}
.grad-bioestimulacao-rejuvenescimento{background:linear-gradient(155deg,#c0a4a8,#6e4753)}
.grad-gluteos{background:linear-gradient(155deg,#bb8f99,#7a3e52)}
.grad-protocolos-especiais{background:linear-gradient(155deg,#8c5560,#452530)}

/* ============================================================
   HERO / CAPA — design roxo-magenta (CAPA_HEAD)
   ============================================================ */
.hero{position:relative;min-height:100dvh;display:flex;flex-direction:column;overflow:hidden;color:#fff}
.hero .media{position:absolute;inset:0}
.hero .media-scrim{background:linear-gradient(to top,rgba(22,13,26,.94) 0%,rgba(22,13,26,.52) 30%,rgba(22,13,26,.06) 54%,rgba(22,13,26,.14) 78%,rgba(40,22,48,.4) 100%)}
.hero-inner{position:relative;z-index:2;display:flex;flex-direction:column;flex:1;
  padding:calc(16px + env(safe-area-inset-top)) var(--pad) calc(42px + env(safe-area-inset-bottom))}

/* menu (pill) */
.hero-nav{display:flex;justify-content:center}
.hero-nav-pill{display:flex;gap:20px;align-items:center;max-width:100%;overflow-x:auto;white-space:nowrap;
  border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:13px 20px;
  background:rgba(26,15,30,.28);
  -webkit-backdrop-filter:blur(8px) saturate(120%);backdrop-filter:blur(8px) saturate(120%)}
.hero-nav-pill a{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:#fff;flex:none;
  transition:color .2s var(--ease)}
.hero-nav-pill a:hover{color:#ff8fbf}

/* conteúdo da capa (base) */
.capa{margin-top:auto}
.capa-title{font-family:'Anton',var(--sans);font-weight:400;text-transform:uppercase;line-height:.92;
  font-size:clamp(36px,10.8vw,60px);letter-spacing:-.01em;white-space:nowrap;transform:skewX(-6deg);transform-origin:left bottom;
  color:#fff;text-shadow:0 10px 34px rgba(0,0,0,.4)}
.capa-title .neon{display:inline-block;
  background:linear-gradient(180deg,#ff77af 0%,#e0459f 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.capa-line{display:block;height:2px;width:min(80%,340px);background:rgba(255,255,255,.9);
  margin:24px 0;transform:skewX(-6deg);transform-origin:left}
.capa-btn{display:inline-flex;align-items:center;justify-content:center;min-height:54px;padding:0 44px;
  border:1.5px solid rgba(255,255,255,.9);border-radius:999px;color:#fff;
  font-size:13px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;
  transition:background .26s var(--ease),color .26s var(--ease),transform .26s var(--ease)}
.capa-btn:hover{background:#fff;color:#3a2340}
.capa-btn:active{transform:scale(.96)}

/* ============================================================
   TOPBAR (telas internas, claras)
   ============================================================ */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;
  padding:calc(12px + env(safe-area-inset-top)) var(--pad) 12px;
  background:color-mix(in srgb,var(--bg) 86%,transparent);
  backdrop-filter:blur(16px) saturate(120%);-webkit-backdrop-filter:blur(16px) saturate(120%);
  border-bottom:1px solid var(--line)}
.back{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;
  border:1px solid var(--line-2);background:var(--paper);color:var(--wine);
  transition:background .2s var(--ease),transform .2s var(--ease)}
.back:active{transform:scale(.93)}
.back:hover{background:var(--rose-1)}
.back svg{width:19px;height:19px}
.topbar-title{flex:1;min-width:0;font-size:13px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.city-chip{font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
  color:var(--burned);border:1px solid var(--line-2);border-radius:999px;padding:6px 12px;white-space:nowrap}

/* ============================================================
   SELEÇÃO DE CIDADE
   ============================================================ */
.city-screen{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;
  padding:56px var(--pad) 48px}
.city-screen .head{margin-bottom:34px}
.city-screen .eyebrow{display:block;margin-bottom:18px}
.city-screen h2{font-size:clamp(30px,8.6vw,40px);font-weight:700;letter-spacing:-.03em;line-height:1.04}
.city-screen .lede{margin-top:16px;max-width:30ch}
.city-cards{display:flex;flex-direction:column;gap:18px}
.city-card{position:relative;display:block;text-align:left;border-radius:var(--r-card);overflow:hidden;
  min-height:216px;color:#fff;box-shadow:var(--shadow-card);
  transition:transform .34s var(--ease),box-shadow .34s var(--ease)}
.city-card:active{transform:scale(.984)}
.city-card:hover{box-shadow:var(--shadow-soft)}
.city-card .media{position:absolute;inset:0}
.city-card .cc-body{position:relative;z-index:2;height:100%;min-height:216px;
  display:flex;flex-direction:column;justify-content:flex-end;padding:24px}
.city-card .cc-eyebrow{font-size:10px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.82)}
.city-card h3{font-size:clamp(28px,8vw,34px);font-weight:700;letter-spacing:-.02em;color:#fff;margin:8px 0 6px}
.city-card p{font-size:13px;font-weight:400;color:rgba(255,255,255,.86);max-width:26ch;line-height:1.5}
.city-card .cc-go{position:absolute;top:22px;right:22px;z-index:3;width:40px;height:40px;border-radius:50%;
  display:grid;place-items:center;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.4);color:#fff;
  backdrop-filter:blur(4px)}
.city-card .cc-go svg{width:20px;height:20px}

/* ============================================================
   HOME DA CIDADE
   ============================================================ */
.home-hero{padding:52px var(--pad) 6px}
.home-hero .welcome{font-size:13px;font-weight:500;letter-spacing:.02em;color:var(--burned)}
.home-hero h2{font-size:clamp(34px,10vw,46px);font-weight:700;letter-spacing:-.035em;line-height:1;margin-top:14px}
.home-hero .loc{display:inline-flex;align-items:center;gap:8px;margin-top:20px;
  font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--wine)}
.home-hero .loc svg{width:15px;height:15px}
.home-hero .continua{margin-top:20px;color:var(--muted);font-size:15.5px;max-width:36ch;line-height:1.6}
.home-mini{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:34px var(--pad) 0}
.mini{border:1px solid var(--line);border-radius:var(--r-ctrl);padding:20px 18px;background:var(--paper)}
.mini .n{font-size:32px;font-weight:700;color:var(--wine);line-height:1;letter-spacing:-.02em}
.mini .l{font-size:11.5px;font-weight:500;color:var(--muted);margin-top:8px;line-height:1.35}
.home-cta{padding:32px var(--pad) 6px}

/* ============================================================
   CATEGORIAS (índice editorial)
   ============================================================ */
.screen-head{padding:44px var(--pad) 10px}
.screen-head .eyebrow{display:block;margin-bottom:16px}
.screen-head h2{font-size:clamp(32px,9vw,44px);font-weight:700;letter-spacing:-.035em;line-height:1.02}
.screen-head .lede{margin-top:16px;max-width:32ch}

.cat-list{padding:14px var(--pad) 0;display:flex;flex-direction:column;gap:30px}
.cat-card{position:relative;display:block;border-radius:var(--r-card);overflow:hidden;background:var(--paper);
  box-shadow:var(--shadow-card);transition:transform .34s var(--ease),box-shadow .34s var(--ease)}
.cat-card:active{transform:scale(.988)}
.cat-card:hover{box-shadow:var(--shadow-soft)}
.cat-card .media{height:200px}
.cat-card .cat-index{position:absolute;top:14px;left:20px;z-index:3;
  font-size:clamp(58px,17vw,84px);font-weight:300;line-height:.8;letter-spacing:-.03em;
  color:rgba(255,255,255,.9);text-shadow:0 6px 24px rgba(63,31,41,.35)}
.cat-body{padding:22px 22px 24px}
.cat-body h3{font-size:clamp(23px,6.6vw,28px);font-weight:600;letter-spacing:-.02em}
.cat-body p{font-size:14px;color:var(--muted);margin-top:8px;line-height:1.5;max-width:34ch}
.cat-body .go{display:inline-flex;align-items:center;gap:9px;margin-top:18px;
  font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--wine)}
.cat-body .go svg{width:15px;height:15px}

/* ============================================================
   PÁGINA DE CATEGORIA — divisória editorial + procedimentos
   ============================================================ */
.cat-hero{padding:40px var(--pad) 6px}
.cat-hero .num{font-size:clamp(64px,24vw,120px);font-weight:300;line-height:.82;letter-spacing:-.04em;color:var(--rose-3)}
.cat-hero .num-line{height:1px;background:var(--line-2);margin:20px 0 22px;width:100%}
.cat-hero .eyebrow{display:block;margin-bottom:14px}
.cat-hero h2{font-size:clamp(32px,9.4vw,46px);font-weight:700;letter-spacing:-.035em;line-height:1.0}
.cat-hero .lede{margin-top:16px;max-width:34ch}

.proc-list{padding:26px var(--pad) 0;display:flex;flex-direction:column;gap:26px}
.card{display:block;border-radius:var(--r-card);overflow:hidden;background:var(--paper);
  box-shadow:var(--shadow-card);transition:transform .34s var(--ease),box-shadow .34s var(--ease)}
.card:active{transform:scale(.99)}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-soft)}
.card .media{height:196px}
.card .badge-eval{position:absolute;top:14px;left:14px;z-index:3;display:inline-flex;align-items:center;gap:7px;
  background:rgba(255,255,255,.94);color:var(--wine-2);font-size:10px;font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;padding:7px 11px;border-radius:999px;backdrop-filter:blur(4px)}
.card .badge-eval .dot{width:5px;height:5px;border-radius:50%;background:var(--burned)}
.card-body{padding:20px 22px 22px}
.card-body h3{font-size:clamp(19px,5.4vw,22px);font-weight:600;letter-spacing:-.015em;line-height:1.12}
.card-body p{font-size:13.5px;font-weight:400;color:var(--muted);margin-top:8px;line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-foot{display:flex;align-items:flex-end;justify-content:space-between;margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}
.price-tag{display:flex;flex-direction:column;gap:3px}
.price-tag .from{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.price-tag .money,.price-tag .money-plain{font-size:clamp(18px,5vw,20px)}
.price-eval{font-size:13.5px;font-weight:600;color:var(--burned);letter-spacing:.01em}
.arrow{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;
  border:1px solid var(--line-2);color:var(--wine);transition:background .24s var(--ease),color .24s var(--ease)}
.arrow svg{width:16px;height:16px}
.card:hover .arrow{background:var(--wine);color:#fff;border-color:var(--wine)}

/* ============================================================
   DETALHE — página editorial do procedimento
   ============================================================ */
.detail-top{padding:34px var(--pad) 0}
.detail-top h2{font-size:clamp(32px,9.2vw,44px);font-weight:700;letter-spacing:-.035em;line-height:1.02}
.detail-impact{margin-top:14px;font-size:clamp(16.5px,4.6vw,19px);font-weight:500;color:var(--burned);line-height:1.4;max-width:30ch}
.detail-eval{display:inline-flex;align-items:center;gap:9px;margin-top:20px;background:var(--rose-1);
  color:var(--wine-2);font-size:12px;font-weight:600;letter-spacing:.02em;padding:9px 15px;border-radius:999px;border:1px solid var(--rose-2)}
.detail-eval .dot{width:6px;height:6px;border-radius:50%;background:var(--burned)}
.detail-photo{margin:28px var(--pad) 0;border-radius:var(--r-media);overflow:hidden;height:clamp(300px,84vw,380px);box-shadow:var(--shadow-card)}
.detail-photo .media{position:absolute;inset:0}
.detail-photo{position:relative}

.blocks{padding:12px var(--pad) 0}
.block{padding:26px 0;border-top:1px solid var(--line)}
.block:first-child{border-top:0}
.block h4{font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--burned)}
.block p{margin-top:12px;font-size:16px;font-weight:400;color:var(--ink);line-height:1.68}
.included{list-style:none;padding:8px 0 0;display:flex;flex-direction:column;gap:14px}
.included li{display:flex;align-items:flex-start;gap:13px;font-size:15.5px;font-weight:400}
.included .ck{flex:none;width:24px;height:24px;border-radius:50%;background:var(--rose-1);display:grid;place-items:center;color:var(--wine);margin-top:1px}
.included .ck svg{width:13px;height:13px}

.invest{padding:30px var(--pad) 0}
.invest .eyebrow{display:block;margin-bottom:16px}
.invest-price{line-height:1}
.invest-price .money{font-size:clamp(34px,10vw,44px)}
.invest-price .money-plain{font-size:clamp(28px,8vw,38px)}
.invest-eval{font-size:clamp(24px,6.5vw,30px);font-weight:600;color:var(--wine);letter-spacing:-.02em}
.invest-sub{margin-top:12px;font-size:13.5px;color:var(--muted);line-height:1.5;max-width:34ch}
.price-options{display:flex;flex-direction:column;gap:12px}
.price-opt{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;
  border:1px solid var(--line-2);border-radius:var(--r-ctrl);background:var(--paper)}
.price-opt .lbl{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.price-opt .money{font-size:clamp(22px,6vw,26px)}

const state = { city: localStorage.getItem('lr_city') || null };
const scrollMem = {};
function setCity(c){ state.city=c; localStorage.setItem('lr_city',c); }
function esc(s){ return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }
function procName(entry){ return entry.name || COPY[entry.id].name; }
function catBySlug(slug){ return CATEGORIES.find(c=>c.slug===slug); }
function cityItems(slug){ return (CITIES[state.city]?.items[slug])||[]; }
function findEntry(slug,id){ return cityItems(slug).find(e=>e.id===id); }

/* --- preço: R$ e valor como um único grupo tipográfico --- */
function money(reais){ return `<span class="money"><span class="cur">R$</span><span class="val">${reais.toLocaleString('pt-BR')}</span></span>`; }
function moneyPlain(str){ return `<span class="money-plain">${esc(str)}</span>`; }

function cardPrice(e){
  if(e.eval && !e.priceNote) return `<span class="price-eval">Sob avaliação</span>`;
  if(e.price!=null) return `<div class="price-tag">${money(e.price)}</div>`;
  if(e.priceOptions){ const min=Math.min(...e.priceOptions.map(o=>o.v));
    return `<div class="price-tag"><span class="from">a partir de</span>${money(min)}</div>`; }
  if(e.priceNote) return `<div class="price-tag">${moneyPlain(e.priceNote)}</div>`;
  return `<span class="price-eval">Sob avaliação</span>`;
}

/* --- imagem: <img> real por cima do gradiente; some se não existir --- */
function imgFor(kind,key){
  if(kind==='hero') return IMG.hero;
  if(kind==='city') return IMG.city[key];
  if(kind==='category') return IMG.category[key];
  if(kind==='procedure') return IMG.procedure[key];
  return null;
}
function mediaHTML(gradKey, iconKey, kind, key, alt, opts){
  opts = opts||{};
  const src = imgFor(kind,key);
  const pos = (kind==='procedure' && IMG_POS[key]) ? ` style="object-position:${IMG_POS[key]}"` : '';
  return `<div class="media grad-${gradKey}">`
    + (iconKey?`<span class="media-ic">${ICON[iconKey]}</span>`:'')
    + (src?`<img class="media-img" src="${esc(src)}" alt="${esc(alt||'')}" loading="${opts.eager?'eager':'lazy'}"${pos} onerror="this.remove()">`:'')
    + (opts.scrim?`<span class="media-scrim"></span>`:'')
    + (opts.overlay||'')
    + `</div>`;
}

function waHref(procNameStr){
  const num = WA[state.city] || WA_DEFAULT;
  const cityName = CITY_LABEL[state.city];
  let msg;
  if(procNameStr && cityName) msg = `Olá! Gostaria de saber mais sobre o procedimento ${procNameStr} em ${cityName}.`;
  else if(cityName) msg = `Olá! Gostaria de conhecer mais sobre os serviços da clínica em ${cityName}.`;
  else msg = `Olá! Gostaria de conhecer mais sobre os serviços da clínica Leticia Ribeiro.`;
  return `https://wa.me/${num}?text=${encodeURIComponent(msg)}`;
}

/* ============================================================
   6. RENDER + ROTEAMENTO (inalterado)
   ============================================================ */
const app = document.getElementById('app');
const fab = document.getElementById('fab');

function render(){
  const hash = location.hash.replace(/^#/,'');
  const parts = hash.split('/');
  const route = parts[0] || 'hero';
  const needCity = ['inicio','categorias','cat','proc'].includes(route);
  if(needCity && !state.city){ sessionStorage.setItem('lr_return', hash); location.hash='cidade'; return; }

  let html='';
  if(route==='hero'||route===''){ html=viewHero(); }
  else if(route==='cidade'){ html=viewCity(); }
  else if(route==='inicio'){ html=viewHome(); }
  else if(route==='categorias'){ html=viewCategories(); }
  else if(route==='cat'){ html=viewCategory(parts[1]); }
  else if(route==='proc'){ html=viewProcedure(parts[1],parts[2]); }
  else if(route==='faq'){ html=viewFaq(); }
  else { html=viewHero(); }

  app.innerHTML = html;
  app.classList.remove('page-in'); void app.offsetWidth; app.classList.add('page-in');
  updateFab(route,parts);
  initReveal();

  if(route==='cat' && scrollMem[parts[1]]!=null){ window.scrollTo(0,scrollMem[parts[1]]); scrollMem[parts[1]]=null; }
  else { window.scrollTo(0,0); }
}

function viewCategory(slug){
  const cat = catBySlug(slug);
  if(!cat){ location.hash='categorias'; return ''; }
  const num = String(CATEGORIES.indexOf(cat)+1).padStart(2,'0');
  const items = cityItems(slug);
  const cards = items.map((e,i)=>{
    const c = COPY[e.id];
    const badge = e.eval ? `<span class="badge-eval"><span class="dot"></span>Avaliação</span>` : '';
    return `
    <a class="card reveal" style="transition-delay:${Math.min(i,6)*50}ms" href="#proc/${slug}/${e.id}">
      ${mediaHTML(slug, c.icon, 'procedure', e.id, procName(e), {overlay:badge})}
      <div class="card-body">
        <h3>${esc(procName(e))}</h3>
        <p>${esc(c.blurb)}</p>
        <div class="card-foot">${cardPrice(e)}<span class="arrow">${ICON.arrowR}</span></div>
      </div>
    </a>`;
  }).join('');
  return `
  ${topbar(cat.name, true, '#categorias')}
  <div class="cat-hero reveal in">
    <div class="num">${num}</div>
    <div class="num-line"></div>
    <span class="eyebrow">${esc(CITY_LABEL[state.city])}</span>

    <p class="lede">${esc(cat.tagline)}</p>

  <div class="proc-list">${cards}</div>
  ${footer()}`;
}

  </div>
  <div class="detail-cta">
    <a class="btn btn-primary reveal in" href="${waHref(name)}" target="_blank" rel="noopener"><span class="wa-ico">${ICON.wa}</span> ${ctaLabel}</a>
  </div>
  <a class="back-link" href="#cat/${slug}">${ICON.arrowL} Voltar para procedimentos</a>
  ${footer()}`;
}

/* ---- FAQ ---- */
function viewFaq(){
  const qa = [
    ['Como funciona o atendimento?','Cada protocolo começa com uma avaliação individual, para entender a sua pele e o seu objetivo antes de indicar qualquer procedimento.'],
    ['Os valores são os mesmos nas duas cidades?','Nem sempre. Abaetetuba e Igarapé-Miri têm tabelas próprias. Escolha a sua cidade para ver apenas os valores dela.'],
    ['O que significa “Avaliação necessária”?','Alguns procedimentos têm o valor definido após uma avaliação, porque dependem da sua indicação individual.'],
    ['Como faço para agendar?','É só falar com a clínica pelo WhatsApp. Ao abrir um procedimento, a mensagem já vai com o nome dele e a sua cidade.'],
    ['Preciso escolher a cidade toda vez?','Não. A sua cidade fica salva no aparelho. Você pode trocar quando quiser em “Trocar cidade”, no rodapé.'],
    ['Os preços incluem quantas sessões?','Quando o procedimento tem opções — 1 sessão, 3 sessões — cada uma aparece com o próprio valor na página do procedimento.']
  ];
  const items = qa.map(([q,a])=>`
    <details class="faq-item reveal">
      <summary>${esc(q)}<span class="plus">${ICON.plus}</span></summary>
      <div class="faq-a">${esc(a)}</div>
    </details>`).join('');
  return `
  ${topbar('FAQ', true, state.city?'#inicio':'#hero')}
  <div class="screen-head reveal in">
    <span class="eyebrow">Perguntas frequentes</span>
    <h2>Tudo o que você precisa saber</h2>
    <p class="lede">Respostas rápidas para você navegar com tranquilidade.</p>
  </div>
  <div class="faq-list">${items}</div>
  ${footer()}`;
}

/* ---- topbar / footer ---- */
function topbar(title, showBack, backHref){
  return `
  <div class="topbar">
    ${showBack?`<a class="back" href="${backHref}" aria-label="Voltar">${ICON.arrowL}</a>`:''}
    <span class="topbar-title">${esc(title)}</span>
    ${state.city?`<span class="city-chip">${esc(CITY_LABEL[state.city])}</span>`:''}
  </div>`;
}
function footer(){
  const cityName = CITY_LABEL[state.city];
  return `
  <footer class="foot">
    <div class="reveal">
      <div class="fmono">Leticia Ribeiro</div>
      <div class="ftype">Clínica de Estética</div>
      ${cityName?`<div class="city-line">${ICON.pin} ${esc(cityName)}</div>`:''}
      <p class="fquote">Seu cuidado merece um momento só seu.</p>
      <div class="flinks">
        <a class="btn btn-light" href="${waHref('')}" target="_blank" rel="noopener"><span class="wa-ico" style="color:#1FA855">${ICON.wa}</span> Agendar meu atendimento</a>
        <a class="btn btn-ghost" href="${esc(INSTAGRAM)}" target="_blank" rel="noopener">Instagram</a>
        <a class="btn btn-ghost" href="#faq">Perguntas frequentes</a>
        <a class="btn btn-ghost" href="#cidade" data-switch>Trocar cidade</a>
      </div>
      <p class="fmeta">© Leticia Ribeiro — Clínica de Estética.<br>Feito com cuidado para você.</p>
    </div>
  </footer>`;
}

/* ---- FAB ---- */
function updateFab(route,parts){
  if(route==='hero'||route===''||route==='cidade'){ fab.classList.add('hide'); return; }
  fab.classList.remove('hide');
  let procNameStr='';
  if(route==='proc'){ const e=findEntry(parts[1],parts[2]); if(e) procNameStr=procName(e); }
  fab.href = waHref(procNameStr);
}

/* ---- REVEAL ---- */
let io;
function initReveal(){
  if(io) io.disconnect();
  const els = app.querySelectorAll('.reveal:not(.in)');
  if(!('IntersectionObserver' in window)){ els.forEach(e=>e.classList.add('in')); return; }
  io = new IntersectionObserver((entries)=>{
    entries.forEach(en=>{ if(en.isIntersecting){ en.target.classList.add('in'); io.unobserve(en.target); } });
  },{rootMargin:'0px 0px -8% 0px',threshold:.08});
  els.forEach(e=>io.observe(e));
}

/* ---- EVENTOS ---- */
document.addEventListener('click',(ev)=>{
  // menu da capa: pular direto pra cidade escolhida
  const navCity = ev.target.closest('[data-nav-city]');
  if(navCity){
    ev.preventDefault();
    setCity(navCity.getAttribute('data-nav-city'));
    if(location.hash==='#inicio'){ render(); } else { location.hash='inicio'; }
    return;
  }
  const cityBtn = ev.target.closest('[data-city]');
  if(cityBtn){
    ev.preventDefault();
    setCity(cityBtn.getAttribute('data-city'));
    const ret = sessionStorage.getItem('lr_return');
    sessionStorage.removeItem('lr_return');
    const target = ret || 'inicio';
    if(('#'+target)===location.hash){ render(); } else { location.hash = target; }
    return;
  }
  const sw = ev.target.closest('[data-switch]');
  if(sw){ const cur=location.hash.replace(/^#/,''); if(cur && cur!=='cidade') sessionStorage.setItem('lr_return', cur); }
  const card = ev.target.closest('a.card');
  if(card){ const m=location.hash.match(/^#cat\/([^/]+)/); if(m) scrollMem[m[1]]=window.scrollY; }
});

window.addEventListener('hashchange', render);
window.addEventListener('DOMContentLoaded', render);
render();
</script>
